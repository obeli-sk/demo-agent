app_name = "demo-agent"

[cloud.integrations]
llm = { type = "llm", env = "LLM_BASE_URL" }

[secrets]
# LLM endpoint bearer (unset for a keyless local backend).
LLM_API_KEY = { optional = true }
# The agent's own Obelisk instance: used by the UI (read polling) and the
# control activities (cancel/stub).
OBELISK_API_TOKEN = { type = "internal" }

# Variables with a `${X:-default}` fallback in deployment.toml are optional.
[public_env]
AGENT_MODELS = { optional = true }
FETCH_ALLOWED_HOST = { optional = true }
LLM_BASE_URL = {}
MAX_STEPS = { optional = true }
OBELISK_API_URL = { type = "internal", source = "api-url" }
OBELISK_UI_URL = { type = "internal", source = "webui-url" }
SYSTEM_PROMPT = { optional = true }
TOOLS_JSON = { optional = true }

# fetch_url's reach: the security boundary for the example HTTP tool. Widen this
# (or add more allowed_host blocks) to let the agent fetch other hosts. A host
# pattern, so wildcards such as `*.example.com` are allowed.
[[outbound_http.allowed_host]]
pattern = "${FETCH_ALLOWED_HOST:-https://obeli.sk}"
methods = ["GET"]

# Agent's own instance: mirrors the component grants in deployment.toml. llm_chat history reads:
[[outbound_http.allowed_host]]
url_prefix = "${OBELISK_API_URL}"
methods = ["POST"]
url_regex_suffix = "/v1/executions/events/batch$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

# control_cancel:
[[outbound_http.allowed_host]]
url_prefix = "${OBELISK_API_URL}"
methods = ["PUT"]
url_regex_suffix = "/v1/executions/E_[^/]+/cancel$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

# control_stub:
[[outbound_http.allowed_host]]
url_prefix = "${OBELISK_API_URL}"
methods = ["PUT"]
url_regex_suffix = "/v1/executions/E_[^/]+/stub$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

# control_cancel and control_stub status checks:
[[outbound_http.allowed_host]]
url_prefix = "${OBELISK_API_URL}"
methods = ["GET"]
url_regex_suffix = "/v1/executions/E_[^/]+/status$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

# ui-api webhook reads:
[[outbound_http.allowed_host]]
url_prefix = "${OBELISK_API_URL}"
methods = ["GET"]
url_regex_suffix = "/v1/executions"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

# LLM server: model discovery, then the chat APIs under an optional per-model path.
[[outbound_http.allowed_host]]
url_prefix = "${LLM_BASE_URL}"
methods = ["GET"]
url_regex_suffix = "/v1/models$"
secrets = ["LLM_API_KEY"]
replace_in = ["headers"]

[[outbound_http.allowed_host]]
url_prefix = "${LLM_BASE_URL}"
methods = ["POST"]
url_regex_suffix = "(/[^/]+)*/v1/(messages|chat/completions|responses)$"
secrets = ["LLM_API_KEY"]
replace_in = ["headers"]

[[outbound_http.allowed_host]]
url_prefix = "${OBELISK_API_URL}"
methods = ["POST"]
url_regex_suffix = "/v1/executions/status/batch$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]
