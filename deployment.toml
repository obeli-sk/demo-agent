# demo-agent: a minimal, JS-only durable Obelisk agent.
#
# One workflow (the agent loop), a multi-provider LLM client, one example HTTP
# tool (fetch_url), the config/discovery activity, two control-plane activities
# the UI calls (cancel/stub), the stub interface the loop self-stubs onto, and
# the web UI webhook. Adding a tool takes a new [[activity_js]] block here, a
# TOOLS_JSON entry below, and an import in workflow/tools.js.

# --- Session config -----------------------------------------------------------
# Read once at session start (activity/config-discover.js). MAX_STEPS caps model
# invocations per turn. TOOLS_JSON is the model-facing tool registry: each entry
# names an activity FFQN (which workflow/tools.js must import) and a JSON Schema
# for its input. SYSTEM_PROMPT overrides the built-in base prompt. Override any
# of them from the environment to retune the linked tools, prompt and budget.
[[activity_js]]
name = "config_discover"
ffqn = "demo-agent:config/config.discover"
wit = "wit"
location = "activity/config-discover.js"
exec.lock_expiry.seconds = 30
env_vars = [
  { key = "MAX_STEPS", value = "${MAX_STEPS:-10}" },
  { key = "TOOLS_JSON", value = '''
${TOOLS_JSON:-[
  {
    "name": "fetch_url",
    "ffqn": "demo-agent:tools/http.fetch-url",
    "description": "HTTP GET a URL and return its status, headers, and body (text).",
    "schema": {
      "type": "object",
      "properties": {
        "url": { "type": "string", "description": "The absolute URL to GET." },
        "headers": { "type": "object", "description": "Optional request headers.", "additionalProperties": { "type": "string" } }
      },
      "required": ["url"]
    }
  }
]}
''' },
  { key = "SYSTEM_PROMPT", value = "${SYSTEM_PROMPT:-}" },
]

# --- LLM endpoint: multi-provider client --------------------------------------
# The only way the agent talks to a model. GET /v1/models supplies the catalog;
# AGENT_MODELS is an optional fallback; each entry routes to a wire API (anthropic-messages,
# openai-chat-completions, openai-responses) under the shared LLM_BASE_URL
# (including any gateway prefix, e.g. "https://openrouter.ai/api"; also the
# allowed_host url_prefix), authenticated by the single LLM_API_KEY secret (unset for keyless).
[[activity_js]]
name = "llm_chat"
ffqn = "demo-agent:llm/chat.completion"
wit = "wit"
location = "activity/llm-chat.js"
exec.lock_expiry.minutes = 10
max_retries = 3
env_vars = [
  { key = "AGENT_MODELS", value = "${AGENT_MODELS:-[]}" },
  { key = "LLM_BASE_URL", value = "${LLM_BASE_URL}" },
  { key = "OBELISK_API_URL", value = "${OBELISK_API_URL}" },
]
[[activity_js.allowed_host]]
url_prefix = "${OBELISK_API_URL}"
methods = ["POST"]
url_regex_suffix = "/v1/executions/events/batch$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]
[[activity_js.allowed_host]]
url_prefix = "${LLM_BASE_URL}"
methods = ["GET"]
url_regex_suffix = "/v1/models$"
secrets = [{ name = "LLM_API_KEY", optional = true }]
replace_in = ["headers"]
[[activity_js.allowed_host]]
url_prefix = "${LLM_BASE_URL}"
methods = ["POST"]
url_regex_suffix = "(/[^/]+)*/v1/(messages|chat/completions|responses)$"
secrets = [{ name = "LLM_API_KEY", optional = true }]
replace_in = ["headers"]

# --- Example tool: fetch_url --------------------------------------------------
# The model-facing HTTP GET tool. Signature is the generic tool contract:
# run(args-json) -> result<string, string>. The allowed_host grant is the
# security boundary: widen FETCH_ALLOWED_HOST (or add more [[allowed_host]]
# blocks) to let the agent reach other hosts. Copy this block, point it at a new
# activity, import it in workflow/tools.js, and register it in TOOLS_JSON.
[[activity_js]]
name = "tool_fetch_url"
ffqn = "demo-agent:tools/http.fetch-url"
params = [{ name = "args-json", type = "string" }]
return_type = "result<string, string>"
location = "activity/fetch-url.js"
exec.lock_expiry.seconds = 30
[[activity_js.allowed_host]]
pattern = "${FETCH_ALLOWED_HOST:-https://obeli.sk}"
methods = ["GET"]

# --- Control plane: what the UI calls to act on a running session -------------
# cancel a run, or fulfil a stub offer (user-input injection / ask_user answer).
# Both talk to the agent's own Obelisk instance (OBELISK_API_URL).
[[activity_js]]
name = "control_cancel"
ffqn = "demo-agent:tools/control.cancel-execution"
wit = "wit"
location = "activity/control-cancel.js"
env_vars = [{ key = "OBELISK_API_URL", value = "${OBELISK_API_URL}" }]
[[activity_js.allowed_host]]
url_prefix = "${OBELISK_API_URL}"
methods = ["PUT"]
url_regex_suffix = "/v1/executions/E_[^/]+/cancel$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]
[[activity_js.allowed_host]]
url_prefix = "${OBELISK_API_URL}"
methods = ["GET"]
url_regex_suffix = "/v1/executions/E_[^/]+/status$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

[[activity_js]]
name = "control_stub"
ffqn = "demo-agent:tools/control.stub-execution"
wit = "wit"
location = "activity/control-stub.js"
env_vars = [{ key = "OBELISK_API_URL", value = "${OBELISK_API_URL}" }]
[[activity_js.allowed_host]]
url_prefix = "${OBELISK_API_URL}"
methods = ["PUT"]
url_regex_suffix = "/v1/executions/E_[^/]+/stub$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]
[[activity_js.allowed_host]]
url_prefix = "${OBELISK_API_URL}"
methods = ["GET"]
url_regex_suffix = "/v1/executions/E_[^/]+/status$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

# --- Stub interface: the notification/injection channel -----------------------
# The workflow self-submits and awaits these. `injection` is the always-open
# user-input offer; `record-output` batches session events onto the durable
# stream the UI reads; `ask-user` is the human-in-the-loop gate.
[[activity_stub]]
name = "stub_injection"
ffqn = "demo-agent:stub/stub.injection"
wit = "wit"

[[activity_stub]]
name = "stub_record_output"
ffqn = "demo-agent:stub/stub.record-output"
wit = "wit"

[[activity_stub]]
name = "stub_ask_user"
ffqn = "demo-agent:stub/stub.ask-user"
wit = "wit"

# --- The agent loop -----------------------------------------------------------
[[workflow_js]]
name = "session"
ffqn = "demo-agent:workflow/workflow.run-cancellable"
location = "workflow/session.js"
params = [
  { name = "prompt", type = "string" },
  { name = "model",  type = "option<string>" },
  { name = "effort", type = "option<string>" },
]
return_type = "result<_, string>"
exec.lock_expiry.minutes = 2

# --- Web UI -------------------------------------------------------------------
[[webhook_endpoint_js]]
name = "ui-api"
location = "webhook/ui-api.js"
routes = [
  { methods = ["GET"], route = "/" },
  { methods = ["GET"], route = "/api/models" },
  { methods = ["GET"], route = "/api/runs" },
  { methods = ["GET"], route = "/api/runs/:execution-id" },
  { methods = ["GET"], route = "/api/logs/:execution-id" },
  { methods = ["POST"], route = "/api/submit" },
  { methods = ["POST"], route = "/api/sessions" },
  { methods = ["POST"], route = "/api/answer/:child-id" },
  { methods = ["POST"], route = "/api/interrupt/:execution-id" },
  { methods = ["POST"], route = "/api/cancel/:execution-id" },
  { methods = ["POST"], route = "/api/input/:execution-id" },
]
env_vars = [
  { key = "OBELISK_API_URL", value = "${OBELISK_API_URL}" },
  { key = "OBELISK_UI_URL", value = "${OBELISK_UI_URL}" },
  { key = "AGENT_MODELS", value = "${AGENT_MODELS:-[]}" },
  { key = "LLM_BASE_URL", value = "${LLM_BASE_URL}" },
]
# Read-only polling (statuses, responses, logs) run as direct fetches from the
# webhook instead of one child activity per call.
[[webhook_endpoint_js.allowed_host]]
url_prefix = "${OBELISK_API_URL}"
methods = ["GET"]
url_regex_suffix = "/v1/executions"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

[[webhook_endpoint_js.allowed_host]]
url_prefix = "${LLM_BASE_URL}"
methods = ["GET"]
url_regex_suffix = "/v1/models$"
secrets = [{ name = "LLM_API_KEY", optional = true }]
replace_in = ["headers"]
