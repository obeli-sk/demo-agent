app_name = "demo-agent"

[secrets]
# LLM endpoint bearer (unset for a keyless local backend).
LLM_API_KEY = { optional = true }
# The agent's own Obelisk instance: used by the UI (read polling) and the
# control activities (cancel/stub).
OBELISK_API_TOKEN = { type = "internal" }

# Variables with a `${X:-default}` fallback in deployment.toml are optional.
[public_env]
AGENT_MODELS = { optional = true }
FETCH_ALLOWED_HOST = { optional = true }
LLM_BASE_URL = { optional = true }
LLM_API_PREFIX = { optional = true }
MAX_STEPS = { optional = true }
OBELISK_API_URL = { type = "internal", source = "api-url" }
OBELISK_UI_URL = { type = "internal", source = "webui-url" }
SYSTEM_PROMPT = { optional = true }
TOOLS_JSON = { optional = true }

# fetch_url's reach: the security boundary for the example HTTP tool. Widen this
# (or add more allowed_host blocks) to let the agent fetch other hosts.
[[outbound_http.allowed_host]]
pattern = "${FETCH_ALLOWED_HOST:-https://obeli.sk}"
methods = ["GET"]

# Agent's own instance: mirrors the three component grants in deployment.toml one-for-one. control_cancel:
[[outbound_http.allowed_host]]
pattern = "${OBELISK_API_URL}"
methods = ["POST"]
request_url_regex = "^POST https?://[^/]+/v1/executions/events/batch$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

# control_cancel:
[[outbound_http.allowed_host]]
pattern = "${OBELISK_API_URL}"
methods = ["GET", "PUT"]
request_url_regex = "^(PUT https?://[^/]+/v1/executions/E_[^/]+/cancel|GET https?://[^/]+/v1/executions/E_[^/]+/status)$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

# control_stub:
[[outbound_http.allowed_host]]
pattern = "${OBELISK_API_URL}"
methods = ["GET", "PUT"]
request_url_regex = "^(PUT https?://[^/]+/v1/executions/E_[^/]+/stub|GET https?://[^/]+/v1/executions/E_[^/]+/status)$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

# ui-api webhook read polling:
[[outbound_http.allowed_host]]
pattern = "${OBELISK_API_URL}"
methods = ["GET"]
request_url_regex = "^GET https?://[^/]+/v1/executions"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

# LLM server.
[[outbound_http.allowed_host]]
pattern = "${LLM_BASE_URL:-http://127.0.0.1:9190}"
methods = ["GET", "POST"]
request_url_regex = "^GET http[s]?://[^/]+(/[^/]+)*/v1/models$|^POST http[s]?://[^/]+(/[^/]+)*/v1/(messages|chat/completions|responses)$"
secrets = ["LLM_API_KEY"]
replace_in = ["headers"]
