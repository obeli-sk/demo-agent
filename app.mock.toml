# App policy for deployment.mock.toml: app.toml without the LLM secret, catalog and grant.

app_name = "demo-agent"

[secrets]
OBELISK_API_TOKEN = { type = "internal" }

# Variables with a `${X:-default}` fallback in deployment.mock.toml are optional.
[public_env]
AGENT_MODELS = { optional = true }
FETCH_ALLOWED_HOST = { optional = true }
MOCK_FETCH_URL = { optional = true }
MAX_STEPS = { optional = true }
OBELISK_API_URL = { type = "internal", source = "api-url" }
OBELISK_UI_URL = { type = "internal", source = "webui-url" }
SYSTEM_PROMPT = { optional = true }
TOOLS_JSON = { optional = true }

# fetch_url's reach (the tool call in the demo is real, against the dummy /demo webhook).
[[outbound_http.allowed_host]]
pattern = "${FETCH_ALLOWED_HOST:-http://127.0.0.1:9090}"
methods = ["GET"]

# Agent's own instance: mirrors the component grants in deployment.mock.toml. llm_chat history reads:
[[outbound_http.allowed_host]]
url_prefix = "${OBELISK_API_URL}"
methods = ["POST"]
url_regex_suffix = "/v1/executions/events/batch$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

# control_cancel:
[[outbound_http.allowed_host]]
url_prefix = "${OBELISK_API_URL}"
methods = ["PUT"]
url_regex_suffix = "/v1/executions/E_[^/]+/cancel$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

# control_stub:
[[outbound_http.allowed_host]]
url_prefix = "${OBELISK_API_URL}"
methods = ["PUT"]
url_regex_suffix = "/v1/executions/E_[^/]+/stub$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

# control_cancel and control_stub status checks:
[[outbound_http.allowed_host]]
url_prefix = "${OBELISK_API_URL}"
methods = ["GET"]
url_regex_suffix = "/v1/executions/E_[^/]+/status$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

# ui-api webhook read polling:
[[outbound_http.allowed_host]]
url_prefix = "${OBELISK_API_URL}"
methods = ["GET"]
url_regex_suffix = "/v1/executions"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]
