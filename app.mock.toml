# App policy for deployment.mock.toml: app.toml without the LLM secret, catalog and grant.

app_name = "demo-agent"

[secrets]
OBELISK_API_TOKEN = { type = "internal" }

# Variables with a `${X:-default}` fallback in deployment.mock.toml are optional.
[public_env]
AGENT_MODELS = { optional = true }
FETCH_ALLOWED_HOST = { optional = true }
MOCK_FETCH_URL = { optional = true }
MAX_STEPS = { optional = true }
OBELISK_API_URL = { optional = true }
OBELISK_UI_URL = { optional = true }
SYSTEM_PROMPT = { optional = true }
TOOLS_JSON = { optional = true }

# fetch_url's reach (the tool call in the demo is real, against the dummy /demo webhook).
[[outbound_http.allowed_host]]
pattern = "${FETCH_ALLOWED_HOST:-http://127.0.0.1:9090}"
methods = ["GET"]

# Agent's own instance: mirrors the three component grants in deployment.mock.toml one-for-one. control_cancel:
[[outbound_http.allowed_host]]
pattern = "${OBELISK_API_URL:-http://127.0.0.1:5005}"
methods = ["POST"]
request_url_regex = "^POST https?://[^/]+/v1/executions/events/batch$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

# control_cancel:
[[outbound_http.allowed_host]]
pattern = "${OBELISK_API_URL:-http://127.0.0.1:5005}"
methods = ["GET", "PUT"]
request_url_regex = "^(PUT https?://[^/]+/v1/executions/E_[^/]+/cancel|GET https?://[^/]+/v1/executions/E_[^/]+/status)$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

# control_stub:
[[outbound_http.allowed_host]]
pattern = "${OBELISK_API_URL:-http://127.0.0.1:5005}"
methods = ["GET", "PUT"]
request_url_regex = "^(PUT https?://[^/]+/v1/executions/E_[^/]+/stub|GET https?://[^/]+/v1/executions/E_[^/]+/status)$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

# ui-api webhook read polling:
[[outbound_http.allowed_host]]
pattern = "${OBELISK_API_URL:-http://127.0.0.1:5005}"
methods = ["GET"]
request_url_regex = "^GET https?://[^/]+/v1/executions"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]
